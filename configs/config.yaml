# THE place you set models & parameters. Code reads only from here.
seed: 42
device: auto     # ingest/vision/index code auto-detects cuda if torch.cuda.is_available() else cpu

# dev.max_pages: 0 = process the full corpus (Kaggle T4x2 run — the real A2 deliverable).
# A small positive number = fast local CPU smoke-test mode, stratified evenly across the 4 books,
# so the whole pipeline can be verified correct in minutes before the full Kaggle run.
dev:       {max_pages: 20}

enhance:   {enabled: false, model: "unet_small", type: "diffusion"}   # out of scope for us — A1 Section 6:
                                                                       # all 4 sources are clean, born-digital
                                                                       # PDFs rasterised at 300dpi, no repair needed.
layout:    {model: "juliozhao/DocLayout-YOLO-DocStructBench", score_thr: 0.4}   # pretrained doc-layout
                                                                       # model (pip extra "layout-yolo");
                                                                       # falls back to a PyMuPDF native
                                                                       # block/table/image heuristic when
                                                                       # that extra isn't installed (see
                                                                       # vision/layout.py + design_choices.md).
ocr:       {model: "facebook/nougat-small", finetune: false}          # BASELINE = pretrained math-aware
                                                                       # vision-language OCR (E25: math /
                                                                       # scientific notation data speciality)
embed:     {model: "sentence-transformers/all-mpnet-base-v2", dim: 768}
index:     {type: "faiss:hnsw", chunk_tokens: 256, overlap: 32}
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
