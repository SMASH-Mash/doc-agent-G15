# THE place you set models & parameters. Code reads only from here.
seed: 42
device: auto     # ingest/vision/index code auto-detects cuda if torch.cuda.is_available() else cpu

# dev.max_pages: 0 = process the full corpus (the real A2 deliverable -- run on Kaggle T4x2 GPU,
# set this to 0 there). A small positive number = fast local smoke-test mode, stratified evenly
# across the 4 books. 300 = the project spec's own minimum-corpus floor (handbook/
# 03-Project-Specification.md Part A: ">= 300 pages AND >= 60,000 words", mirrored verbatim as
# MIN_PAGES/MIN_WORDS in data/validate.py) -- raised from the earlier 4-page pure-smoke-test value
# so A2's submitted OCR-quality/index/retrieval evidence is measured over a sample at the same
# scale the spec itself calls the minimum usable corpus, not just a few pages picked for a
# multi-minute CPU correctness check. Only 3 held-out pages (grading_kit/heldout_pages/) are
# excluded by hand-picking their page numbers outside this sampler's bucket-centered picks --
# verify no overlap after changing this value. This dev machine has an NVIDIA GPU (torch is
# installed from the cu121 index per [tool.uv.sources] in pyproject.toml), so 300 pages runs on
# CUDA, not CPU -- the earlier "~5-8s/region on CPU" timing note no longer applies here.
dev:       {max_pages: 300}

enhance:   {enabled: false, model: "unet_small", type: "diffusion"}   # out of scope for us — A1 Section 6:
                                                                       # all 4 sources are clean, born-digital
                                                                       # PDFs rasterised at 300dpi, no repair needed.
layout:    {model: "juliozhao/DocLayout-YOLO-DocStructBench", score_thr: 0.4, revision: "8c3299a30b8ff29a1503c4431b035b93220f7b11"}
                                                                       # pretrained doc-layout
                                                                       # model (pip extra "layout-yolo");
                                                                       # falls back to a PyMuPDF native
                                                                       # block/table/image heuristic when
                                                                       # that extra isn't installed (see
                                                                       # vision/layout.py + design_choices.md).
                                                                       # revision: pinned HF commit SHA (not a
                                                                       # movable branch/tag) -- fixes bandit's
                                                                       # B615 "unsafe HF download" finding
                                                                       # (CI's security.yml gate) and protects
                                                                       # against the upstream repo's weights
                                                                       # changing under us between runs.
ocr:       {model: "facebook/nougat-small", finetune: false, revision: "dced72ae7bcdfcb82a9ef55543a90a7a5e4d32e6"}
                                                                       # BASELINE = pretrained math-aware
                                                                       # vision-language OCR (E25: math /
                                                                       # scientific notation data speciality)
                                                                       # revision: pinned HF commit SHA, see
                                                                       # layout.revision's comment above.
embed:     {model: "sentence-transformers/all-mpnet-base-v2", dim: 768, batch_size: 32, revision: "e8c3b32edf5434bc2275fc9bab85f82640a19130"}
                                                                       # batch_size: was pinned to 1 out of an
                                                                       # earlier (wrong) hypothesis that OCR+
                                                                       # embed batching caused this dev machine's
                                                                       # crash. Root cause is now precisely
                                                                       # isolated -- see index.type below, it
                                                                       # was faiss IndexHNSWFlat, not batching or
                                                                       # OCR/embed interaction -- re-verified with
                                                                       # the flat index, so raised to 32: mpnet-base
                                                                       # (~420MB) batched at 32x256-token chunks is
                                                                       # a trivial fraction of an 8GB card's VRAM
                                                                       # (and negligible on CPU too), so this is
                                                                       # free throughput either way.
index:     {type: "faiss:flat", chunk_tokens: 256, overlap: 32}
                                                                       # faiss:flat, not faiss:hnsw: live,
                                                                       # user-supervised debugging isolated a
                                                                       # reproducible native crash (Windows
                                                                       # STATUS_ACCESS_VIOLATION) inside
                                                                       # faiss-cpu 1.8.0's IndexHNSWFlat.add()
                                                                       # itself on this machine, confirmed with a
                                                                       # bare numpy+faiss repro (zero ML models
                                                                       # involved) -- so it was never the OCR/
                                                                       # embed interaction earlier hypotheses
                                                                       # blamed. IndexFlatIP does not crash on
                                                                       # identical data; exact (not approximate)
                                                                       # cosine search is fast enough at our
                                                                       # scale that dropping HNSW costs nothing
                                                                       # observable. See index/store.py + Stage 4
                                                                       # row in design_choices.md.
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
