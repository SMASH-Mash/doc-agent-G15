[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2,<2.4",
  "torchvision>=0.17,<0.19",   # transitive dep of Nougat/timm; listed explicitly (rather than left
                                # transitive) so the tool.uv.sources CPU-index pin below actually
                                # applies to it -- uv only honors a source override for a package
                                # that appears as a direct dependency.
  "lightning>=2.2,<2.4",
  "transformers>=4.40,<4.45",
  "timm>=1.0,<1.1",
  "datasets>=2.19,<3.0",
  "torchmetrics>=1.3,<1.5",
  "sentence-transformers>=2.7,<3.0",
  "faiss-cpu>=1.8,<1.9",
  "gymnasium>=0.29,<1.0",
  "fastapi>=0.111,<0.116",
  "gradio>=4.31,<5.0",
  "wandb>=0.17,<0.18",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "pydantic-settings>=2.2,<3.0",
  "pymupdf>=1.24,<2.0",
  "pillow>=10.0,<11.0",
  "sentencepiece>=0.2,<0.3",
  "gdown>=5.0,<6.0",
  "nltk>=3.8,<4.0",              # required by transformers' NougatTokenizerFast.post_process_generation
  "python-levenshtein>=0.25,<1.0",  # ditto
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "black>=24.4", "mypy>=1.10,<2.0", "pytest>=8.2", "pre-commit>=3.7"]
# Pretrained layout model (vision/layout.py primary backend). Kept optional: its transitive dep
# albumentations->albucore->stringzilla has no prebuilt wheel for Windows+cp311, requiring an MSVC
# toolchain to build from source there. Linux (CI, Kaggle) installs it cleanly from prebuilt wheels.
# layout.py auto-falls back to a PyMuPDF-based heuristic detector when this extra isn't installed.
layout-yolo = ["doclayout-yolo>=0.0.3,<0.1"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","N","B","UP"]
# F405/F403: the stub's own convention is `from ..contracts import *  # noqa` in nearly every module —
# inherent to that pattern, not a real issue (contracts.py's names are the fixed data contracts).
# E501: a handful of course-authored docstrings/comments sit a few chars over line-length; not worth
# reflowing unrelated stub prose. N812: `import lightning as L` is PyTorch Lightning's own documented
# import convention (training/ stubs), not a naming mistake.
ignore = ["F403", "F405", "E501", "N812"]
[tool.black]
line-length = 100
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
# sqlite's file locking is unreliable over this repo's UNC/WSL-mounted path, which crashes mypy's
# default sqlite-backed cache with "database is locked" (INTERNAL ERROR) on every run. The plain
# filesystem cache works fine here, so pin it off rather than requiring every invocation to pass
# --no-sqlite-cache by hand.
sqlite_cache = false
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

# CUDA-enabled torch wheels (cu121): committed as the default so a plain `uv sync` / `uv run`
# always lands on a CUDA-capable build. This is safe on machines with no NVIDIA GPU too -- a cu121
# torch installs and runs fine as pure CPU there, torch.cuda.is_available() just returns False and
# ocr.py/embed.py/layout.py (which all branch on that already) fall back to CPU automatically. The
# only cost on a no-GPU machine is a larger download (~2.5GB vs ~200MB for the CPU-only wheel) --
# accepted deliberately so "runs on GPU if present, CPU otherwise" is the literal default behavior
# of `uv sync --frozen`, with no extra flags or manual reinstalls required. cu121 was picked because
# it's torch 2.3.1's most current published CUDA build and is forward-compatible with any driver
# reporting CUDA >=12.1 (this dev machine's driver reports CUDA 13.3 -- newer drivers stay backward
# compatible with older CUDA runtime builds). Kaggle/Colab GPU runs use their own pre-installed CUDA
# torch and do not go through this lockfile, so this has no effect there.
# torchvision must be pinned to the same index: torchvision is a transitive dep (pulled in for
# Nougat/timm) and left unpinned it resolves whatever generic wheel PyPI serves, which is ABI-
# incompatible with a CUDA/`+cpu`-suffixed torch build -- surfaces at runtime as
# "RuntimeError: operator torchvision::nms does not exist" the first time transformers imports
# NougatProcessor.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
