# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

# Stage 1 — deterministic corpus ingestion. These defaults match the clean, born-digital
# ATLAS textbook scans described in A1: rasterise at 300 dpi and preserve RGB strokes.
ingest:
  raw_dir: data/raw
  pages_dir: data/interim/pages
  manifest_path: data/interim/pages.jsonl
  dpi: 300
  overwrite: false

preprocess:
  enabled: true
  output_dir: data/interim/preprocessed
  overwrite: false
  deskew: false
  denoise: false
  denoise_strength: 7
  autocontrast: false
  grayscale: false
  binarize: false
  adaptive_block_size: 35
  adaptive_c: 11

# Enhancement is bonus/gated and is not justified for the clean born-digital corpus.
enhance: {enabled: false, model: "none", type: "none"}

# A2 vision stages use pinned, reproducible checkpoints; indexing remains in the next step.
layout:
  model: "docling-project/docling-layout-heron"
  revision: "8f39ad3c0b4c58e9c2d2c84a38465abf757272d8"
  device: cuda
  # 0.60 -> 0.75: raised after CER/WER experiments on grading_kit's 18 heldout pages found the
  # accuracy problem was layout over-segmentation (the same content detected 2-3x at low
  # confidence, e.g. one sentence detected 3 separate times, a heading/text pair on an identical
  # bbox, nested overlapping boxes around one equation), not an OCR-decoding problem -- every
  # OCR-side fix (retries, repetition penalty, prompting) was neutral or actively harmful, while
  # this one change alone cut normalized WER from 95.27% to 70.44% and CER from 47.57% to 45.99%.
  # Verified this isn't just discarding real content: total hypothesis words stayed well above
  # total reference words after the change (no under-detection). See conversation history /
  # scratch experiment logs for the full 10-run sweep (0.60/0.65/0.70/0.72/0.75/0.77/0.80/0.85/0.90).
  score_threshold: 0.75
  batch_size: 1
  dedupe_iou: 0.85
  ignored_labels: [page_header, page_footer]
  manifest_path: data/interim/layout/regions.jsonl
  save_debug: false
  debug_dir: data/interim/layout/debug
ocr:
  model: "docling-project/granite-docling-2stage-258m"
  revision: "12bb780c5b56af33e255c83719394e6d0be2227e"
  device: cuda
  dtype: auto
  page_manifest_path: data/interim/pages.jsonl
  layout_manifest_path: data/interim/layout/regions.jsonl
  manifest_path: data/interim/ocr/chunks.jsonl
  crop_padding: 12
  min_crop_height: 96
  location_scale: 500
  skip_kinds: [figure]
  quality_profile: "adaptive_bbox_retry_v2"
  max_new_tokens: 384
  min_new_tokens: 24
  estimated_line_height: 44
  estimated_char_width: 18
  retry_repetition_penalty: 1.08
  retry_no_repeat_ngram_size: 4
  max_retries: 1
  empty_cache_every: 8
  token_limits:
    heading: 64
    section_header: 64
    title: 64
    caption: 192
    formula: 224
    table: 384
    code: 256
    list_item: 192
    text: 256
    default: 192
  resume: true
  overwrite: false
  max_regions: 0
  save_debug: false
  debug_dir: data/interim/ocr/debug
  prompts:
    default: "Convert this page to docling."
    formula: "<formula>"
    table: "<otsl>"
    code: "<code>"
chunk:
  strategy: "structure_aware"
  chunk_tokens: 384
  overlap: 48
  heading_context_tokens: 64
  heading_labels: [heading, section_header, title]
  atomic_labels: [formula, table, code]
  manifest_path: data/interim/chunks/chunks.jsonl
embed: {model: "BAAI/bge-m3", dim: 1024, normalize: true}
index: {type: "faiss:flat_ip"}
retrieve: {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "BAAI/bge-reranker-v2-m3"}
agent: {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl: {algo: "ppo", train_policy: false}
serve: {batch: true}
deploy: {target: "hf-spaces"}
