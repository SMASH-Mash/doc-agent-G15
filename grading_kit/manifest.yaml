# grading_kit/manifest.yaml — the SINGLE entry point a grader reads.
# Carried forward from A1 (graded on Moodle before this repo existed) + updated at A2 with the built KB.

project_id: "G15"

axes:
  domain: "High School STEM Education (Advanced High School & Calculus Mathematics)"
  data_speciality: "math-notation"   # dense LaTeX-able formulas, fractions, multi-line derivations,
                                      # geometric diagrams — see data/provenance.md for the difficulty analysis
  primary_nfr: "explainable"
  nfr_target: "Grounded Explanation Faithfulness Score >= 0.90 (LLM-judge step verification), 100% citation traceability"

corpus:
  path: data/raw/
  pages: 2521                        # 4 books; floor: >= 300 (met)
  words: 744092                      # floor: >= 60000 (met)
  provenance: data/provenance.md

heldout:
  pages_dir: grading_kit/heldout_pages/
  labels:    grading_kit/labels.jsonl

entrypoints:
  build_index: scripts/build_index.sh
  run_query:   scripts/run.sh
  eval_tasks:  grading_kit/tasks.jsonl      # authored in A3
  checker:     grading_kit/success_check.py
  trace:       traces/run.jsonl              # JSONL trajectory the A3 agentic-feature check reads
